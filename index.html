<html lang="ko">
<head>

<meta name="color-scheme" content="dark light">
<script>
(function(){
  var t = "dark";
  try { t = localStorage.getItem("cs_theme") || "dark" } catch(e) {}
  if (t !== "auto") document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<title>Dip Radar</title>
<style>
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --mfg:#71717a; --bd:#e4e4e7; --ring:#a1a1aa;
  --radius:10px;
  --up:#dc2626; --down:#2563eb;
  --vi:#6d28d9; --vi-bg:#f5f3ff; --vi-bd:#ddd6fe; --vi-bar:#a78bfa;
  --am:#b45309; --am-bg:#fffbeb; --am-bd:#fde68a;
  --gr:#15803d; --gr-bg:#f0fdf4; --gr-bd:#bbf7d0;
  --warn-bg:#fffbeb; --warn-fg:#92400e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --fg:#fafafa; --card:#0f0f12; --muted:#27272a; --mfg:#a1a1aa; --bd:#27272a; --ring:#52525b;
    --up:#f87171; --down:#60a5fa;
    --vi:#c4b5fd; --vi-bg:#1b1535; --vi-bd:#4c1d95; --vi-bar:#5b21b6;
    --am:#fbbf24; --am-bg:#26190a; --am-bd:#78350f;
    --gr:#4ade80; --gr-bg:#0a2014; --gr-bd:#14532d;
    --warn-bg:#26190a; --warn-fg:#fcd34d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa; --card:#0f0f12; --muted:#27272a; --mfg:#a1a1aa; --bd:#27272a; --ring:#52525b;
  --up:#f87171; --down:#60a5fa;
  --vi:#c4b5fd; --vi-bg:#1b1535; --vi-bd:#4c1d95; --vi-bar:#5b21b6;
  --am:#fbbf24; --am-bg:#26190a; --am-bd:#78350f;
  --gr:#4ade80; --gr-bg:#0a2014; --gr-bd:#14532d;
  --warn-bg:#26190a; --warn-fg:#fcd34d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ring); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:16px 14px 48px}
.num{font-variant-numeric:tabular-nums}

.up{color:var(--up)} .down{color:var(--down)}

.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:12px}

.c i{font-style:normal; font-size:12px; color:var(--mfg)}

.lg{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mfg); padding:2px 2px 0; margin-top:4px}
.lg span::before{content:""; display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; border:1px solid var(--bd)}

.more{width:100%; height:46px; margin-top:12px; border:1px solid var(--bd); border-radius:var(--radius); background:var(--card); font-weight:500}

.empty{padding:28px 8px; text-align:center; color:var(--mfg)}
.sk{height:84px; border-radius:14px; background:linear-gradient(90deg,var(--muted),var(--bd),var(--muted)); background-size:200% 100%; animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

h2{font-size:15px; font-weight:600; margin:26px 2px 8px}
.log{padding:2px 14px}
.li{padding:12px 0; border-bottom:1px solid var(--bd); font-size:13.5px; white-space:pre-line}
.li:last-child{border-bottom:0}
.li time{display:block; font-size:12px; color:var(--mfg); margin-bottom:2px}
.foot{margin:16px 2px 0; color:var(--mfg); font-size:12.5px; line-height:1.7}

.back{display:inline-flex; align-items:center; gap:6px; height:44px; padding:0 10px 0 4px; margin-left:-4px; color:var(--mfg); font-size:14.5px}
.back:hover{color:var(--fg)}
.dh{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:2px 0 14px}
.dh h1{margin:0; font-size:23px; font-weight:600; letter-spacing:-0.01em}
.dh h1 small{font-size:13px; font-weight:400; color:var(--mfg); margin-left:6px}
.dh .big{font-size:25px; font-weight:600; text-align:right}
.dh .big small{font-size:13px; font-weight:400; color:var(--mfg)}
.nwc{display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px}
a.nwc:hover{background:var(--muted)}
.nt{font-size:15.5px; font-weight:600; line-height:1.5; margin:0 0 8px}
.nmeta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--mfg)}
.ntag{font-size:11.5px; font-weight:500; padding:1px 8px; border-radius:999px; border:1px solid var(--bd); color:var(--fg)}
.ntag.w{background:var(--vi-bg); color:var(--vi); border-color:var(--vi-bd)}
.nnew{color:var(--gr); font-weight:600}
.linkbtn{display:flex; align-items:center; justify-content:center; gap:8px; height:46px; border:1px solid var(--bd); border-radius:var(--radius); background:var(--card); color:var(--fg); text-decoration:none; font-weight:500; font-size:14px; margin-bottom:16px}
.linkbtn:hover{background:var(--muted)}
.cau{font-size:11.5px; font-weight:600; background:var(--am); color:var(--bg); border-radius:4px; padding:0 6px; margin-left:6px; vertical-align:2px}
.wp{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.wp .wtop b{font-size:15px; font-weight:600}
.wp .wsub{font-size:12px; color:var(--mfg); margin-top:2px}
.wbtns{display:flex; gap:8px; flex-wrap:wrap}
.wb{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:42px; padding:0 14px; border:1px solid var(--bd); border-radius:9px; background:var(--card); color:var(--fg); font-size:14px; font-weight:500}
.wb:hover{background:var(--muted)}
.wb.pri{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.wlist{background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:2px 14px; margin-top:10px}
.wr{display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--bd); min-height:62px}
.wr:last-child{border-bottom:0}
.wr .wn{flex:1; min-width:0}
.wr .wn b{font-weight:600; font-size:15.5px}
.wr .wn small{font-size:12px; color:var(--mfg); margin-left:6px}
.wr .wn div{font-size:12.5px; color:var(--mfg)}
.rmb,.adb{flex:none; width:44px; height:44px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:24px; line-height:1; border:1px solid}
.rmb{color:var(--up); border-color:var(--up); background:transparent}
.adb{color:var(--gr); border-color:var(--gr-bd); background:var(--gr-bg)}
.adb.dn{color:var(--mfg); border-color:var(--bd); background:var(--muted); font-size:18px}
.wsearch{margin-top:10px}
#toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); max-width:90%; padding:10px 14px; border-radius:10px; background:var(--fg); color:var(--bg); font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:20}
#toast.show{opacity:1}
.btn2{display:flex; align-items:center; justify-content:center; width:100%; min-height:44px; margin-top:10px; border:1px solid var(--bd); border-radius:var(--radius); background:var(--card); color:var(--fg); font-weight:500; font-size:14px}
.btn2:hover{background:var(--muted)}
.sm{border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:16px; display:flex; flex-direction:column; gap:9px}
.sm.vi{background:var(--vi-bg); border-color:var(--vi-bd)}
.sm.am{background:var(--am-bg); border-color:var(--am-bd)}
.sm.gr{background:var(--gr-bg); border-color:var(--gr-bd)}
.sm .t{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mfg)}
.ln{display:flex; gap:9px; align-items:flex-start; font-size:14.5px; line-height:1.55}
.ln i{flex:none; width:10px; height:10px; border-radius:50%; margin-top:7px}
.ln b{font-weight:600}
.lead{font-size:13px; color:var(--mfg); line-height:1.6; margin:0 2px 8px}
.lead b{font-weight:600; color:var(--fg)}
.s{font-size:14px; line-height:1.55}
.s b{font-weight:600}
.bw{padding-top:20px}
.bar u i{position:absolute; bottom:22px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; color:var(--fg); white-space:nowrap}
.ends{display:flex; justify-content:space-between; font-size:12px; color:var(--mfg)}
.cell span{display:block; font-size:11px; color:var(--mfg); margin-top:1px}
button.cell{color:inherit; font:inherit; cursor:pointer; width:100%}
button.cell:hover{background:var(--muted)}
.how{display:flex; flex-direction:column; gap:12px; font-size:13.5px; line-height:1.6}

.verdict.gr{background:var(--gr-bg); border-color:var(--gr-bd)}

.verdict.vi h3{color:var(--vi)} .verdict.am h3{color:var(--am)} .verdict.gr h3{color:var(--gr)}
.verdict p{margin:0 0 4px; font-size:14px; line-height:1.6}
.sec{margin-bottom:16px}
.sec>.hd{display:flex; justify-content:space-between; align-items:baseline; margin:0 2px 8px}
.sec>.hd b{font-size:15px; font-weight:600}
.sec>.hd span{font-size:12px; color:var(--mfg)}
.rows{padding:2px 14px; overflow:hidden}

.row:last-child{border-bottom:0}
.row.hl{background:var(--vi-bg); margin:0 -14px; padding:14px}
.rt{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rt b{font-weight:600; font-size:15px}
.rt span{font-size:13px; color:var(--mfg)}

.row.hl .bar u{border-color:var(--vi-bg)}
.bar u.nl{background:var(--am)}

.vi-t{color:var(--vi)} .am-t{color:var(--am)}

<body>
<div class="wrap">

  <div id="listView">
    <div class="hdr">
      <div>
        <h1>Dip Radar</h1>
        <div class="sub"><span class="dot" id="dot"></span><span id="sub">불러오는 중</span></div>
      </div>
      <div style="display:flex;gap:8px">
      <button class="ibtn" id="newsBtn" aria-label="코인 뉴스" title="코인 뉴스"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"/><rect x="6" y="6" width="12" height="3" rx=".6" fill="currentColor" stroke="none"/><rect x="6" y="11.5" width="5" height="4.5" rx=".6"/><path d="M13.5 12.2h4.5M13.5 15.2h4.5M6 18.6h12"/></svg></button>
      <button class="ibtn tx" id="theme" aria-label="화면 색 바꾸기">어둡게</button>
      <button class="ibtn" id="rf" aria-label="새로고침"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      </div>
    </div>
    <div id="stale" class="alert" hidden></div>

    <div class="seg" id="ex" role="group" aria-label="거래소" style="margin-bottom:12px"></div>

    <div class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="코인 이름이나 기호로 검색" autocomplete="off" aria-label="코인 검색"></div>

    <div class="lbl"><span id="lblTxt">하락폭 순서 · 고른 기간에 많이 떨어진 코인부터</span><button class="flip" id="flip" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>순서 뒤집기</button></div>
    <div class="seg" id="sort" role="group" aria-label="하락폭 기준 기간"></div>

    <div class="chips" id="chips" role="group" aria-label="필터"></div>

    <div class="seg" id="view" role="group" aria-label="보기 방식"></div>

    <div id="wpanel" hidden></div>

    <div class="list" id="list"></div>
    <div class="lg" id="legend" hidden><span class="a">저점 근처</span><span class="b">새 최저가</span><span>그 밖</span></div>
    <p class="lead" id="legendNote" hidden style="margin-top:8px">칩의 숫자는 그 기간에 <b>가장 쌌던 가격보다 지금이 몇 % 비싼지</b>예요. 숫자가 작을수록 바닥에 가까워요.</p>
    <button class="more" id="more" hidden></button>

    <h2>최근 알림</h2>
    <div class="card log" id="log"><div class="empty">아직 알림이 없어요.</div></div>
    <p class="foot" id="foot"></p>
    <p class="foot" id="diag" style="margin-top:6px"></p>
  </div>

  <div id="detailView" hidden></div>
  <div id="newsView" hidden></div>
<div id="toast" role="status"></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(i){ return document.getElementById(i) };
  var DATA = null, UP = null, WATCH = {}, curDetail = null, listY = 0, upLoading = false;
  var S = {sort:"m", filter:"ALL", view:"simple", q:"", shown:30, ex:"bithumb", dir:1, wmode:"view", wq:""};
  var EXN = {bithumb:"빗썸", upbit:"업비트"};
  function cur(){ return S.ex === "upbit" ? UP : DATA }
  var SORTS = [["d","1일"],["w","1주"],["m","1개월"],["q","3개월"],["h","6개월"],["y","12개월"],["y2","24개월"]];
  var PERIODS = [["w","1주"],["m","1개월"],["q","3개월"],["h","6개월"],["y","12개월"],["a","역대"]];
  var TAGS = {NEWLOW:["신저가 갱신","am"], REBOUND:["저점 반등","gr"], LOW:["저점권","vi"], SHORT:["단기 저점","vo"], HIGH:["고점권","mu"], MID:["중간","mu"], NONE:["준비 중","mu"]};
  var FILTERS = [["ALL","전체"],["WATCH","관심"],["LOW","저점권"],["NEWLOW","신저가"],["REBOUND","저점 반등"],["CAU","유의"]];
  var VIEWS = [["simple","간단히"],["chips","저점 칩"]];
  var VERDICT = {
    NEWLOW:["신저가 갱신","am","더 내려갈 수 있는 상태예요. 반등이 확인될 때까지 지켜보세요."],
    REBOUND:["저점 반등","gr","저점에서 4% 이상 올라서고 3일 전보다 높을 때 표시돼요."],
    LOW:["저점권 · 반등 대기","vi","아직 반등이 확인되지 않았어요."],
    SHORT:["단기 저점","vi","1주나 1개월 범위의 아래쪽 15% 안이에요. 3개월 이상 기간으로는 아직 저점권이 아니에요."],
    HIGH:["고점권","","3개월 범위의 위쪽 15% 안에 있어요."],
    MID:["중간","","저점과 고점 사이에 있어요."],
    NONE:["데이터 준비 중","","일봉을 받는 중이에요. 다음 자동 실행 뒤에 보여요."]
  };

  function el(tag, cls, text){ var d = document.createElement(tag); if(cls) d.className = cls; if(text != null) d.textContent = text; return d }
  function fmtPrice(p){
    var d = p >= 1000 ? 0 : p >= 100 ? 1 : p >= 10 ? 2 : p >= 1 ? 3 : p >= 0.1 ? 4 : 6;
    return p.toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  function fmtPct(x, d){
    var dd = d == null ? 1 : d, v = x * 100;
    var t = Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:dd, maximumFractionDigits:dd});
    return (v > 0.0001 ? "+" : v < -0.0001 ? "-" : "") + t + "%";
  }
  function posOf(p, lo){ return lo[1] <= lo[0] ? 0.5 : Math.min(1, Math.max(0, (p - lo[0]) / (lo[1] - lo[0]))) }
  function sortLabel(k){ for(var i = 0; i < SORTS.length; i++) if(SORTS[i][0] === k) return SORTS[i][1]; return k }
  function isNewLow(p, lo){ return !!lo && lo[2] === 0 && p <= lo[0] * 1.0005 }
  function inZone(key, p, lo, age){
    if(!lo) return false;
    if(key === "a") return age >= 90 && p / lo[0] - 1 <= 0.30;
    return posOf(p, lo) <= 0.15;
  }
  function ago(iso){
    var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if(m < 1) return "방금"; if(m < 60) return m + "분 전";
    var h = Math.floor(m / 60); return h < 24 ? h + "시간 전" : Math.floor(h / 24) + "일 전";
  }
  function kst(iso){
    var d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000), p = function(n){ return (n < 10 ? "0" : "") + n };
    return (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
  }
  function daysText(n){
    if(n === 0) return "오늘";
    if(n < 60) return n + "일 전";
    if(n < 700) return Math.round(n / 30) + "개월 전";
    return (n / 365).toFixed(1) + "년 전";
  }
  function eunneun(label){   // 받침이 있으면 "은", 없으면 "는"
    var c = label.charCodeAt(label.length - 1) - 0xAC00;
    return (c >= 0 && c <= 11171 && c % 28 !== 0) ? "은" : "는";
  }
  function tone(v){ return v == null ? "mu" : v >= 0 ? "up" : "down" }

  /* ---------- 관심 종목 (이 폰에 저장 + 선택하면 서버 설정 파일에도 반영) ---------- */
  var WS = {}, WLK = {bithumb:"dr_w_b", upbit:"dr_w_u"}, MAXW = 20;
  function lsGet(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
  function lsSet(k, v){ try{ localStorage.setItem(k, v) }catch(e){} }
  function lsDel(k){ try{ localStorage.removeItem(k) }catch(e){} }
  function serverWatch(ex){ return (DATA && (ex === "upbit" ? DATA.watch_upbit : DATA.watch)) || [] }
  function curWatch(ex){
    var raw = lsGet(WLK[ex]);
    if(raw){ try{ var o = JSON.parse(raw); if(o && Array.isArray(o.list)) return o.list }catch(e){} }
    return serverWatch(ex);
  }
  function refreshWS(){ WS = {}; curWatch(S.ex).forEach(function(m){ WS[m] = 1 }) }
  function reconcile(){   // 서버 목록이 이 폰에서 바꾼 목록과 같아지면, 폰에 임시로 둔 목록은 지워요
    ["bithumb", "upbit"].forEach(function(ex){
      var raw = lsGet(WLK[ex]); if(!raw) return;
      try{
        var o = JSON.parse(raw), a = (o.list || []).slice().sort().join("|"), b = serverWatch(ex).slice().sort().join("|");
        if(a === b) lsDel(WLK[ex]);
      }catch(e){ lsDel(WLK[ex]) }
    });
  }
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show") }, 2200);
  }
  function afterWatch(){
    refreshWS();
    if(curDetail && curDetail !== "_news") route(); else renderList();
  }
  function setWatch(list){
    lsSet(WLK[S.ex], JSON.stringify({list:list, t:Date.now()}));
    afterWatch();
  }
  function addWatch(m){
    var l = curWatch(S.ex).slice();
    if(l.indexOf(m) >= 0) return;
    if(l.length >= MAXW){ toast("관심 종목은 최대 " + MAXW + "개까지예요"); return }
    l.push(m); setWatch(l); toast("관심에 추가했어요");
  }
  function delWatch(m){ setWatch(curWatch(S.ex).filter(function(x){ return x !== m })); toast("관심에서 뺐어요") }

  function matches(c){
    if(S.q){
      var q = S.q.toLowerCase();
      if(c.n.toLowerCase().indexOf(q) < 0 && c.s.toLowerCase().indexOf(q) < 0) return false;
    }
    var f = S.filter;
    if(f === "ALL") return true;
    if(f === "WATCH") return !!WS[c.m];
    if(f === "CAU") return !!c.cau;
    return c.tag === f;
  }
  function filters(){ return FILTERS }
  function counts(){
    var n = {};
    FILTERS.forEach(function(f){ n[f[0]] = 0 });
    cur().coins.forEach(function(c){
      n.ALL++; if(WS[c.m]) n.WATCH++; if(c.cau) n.CAU++;
      if(n[c.tag] != null) n[c.tag]++;
    });
    return n;
  }
  function sortedCoins(){
    var k = S.sort;
    var pinFirst = S.filter === "WATCH";
    return cur().coins.filter(matches).sort(function(a, b){
      if(pinFirst){ var pa = a.pin ? 1 : 0, pb = b.pin ? 1 : 0; if(pa !== pb) return pb - pa }
      var va = a.ch[k], vb = b.ch[k];
      if(va == null && vb == null) return 0;
      if(va == null) return 1;
      if(vb == null) return -1;
      return (va - vb) * S.dir;
    });
  }

  function chips(c){
    var g = el("div", "g3");
    PERIODS.forEach(function(p){
      var lo = c.lo[p[0]], age = c.age || 0, cell = el("div", "c");
      cell.appendChild(el("i", null, p[1]));
      if(!lo){ cell.appendChild(el("b", "s2", "-")); g.appendChild(cell); return }
      if(p[0] === "a" && age < 90){ cell.appendChild(el("b", "s2", "상장 " + age + "일")); g.appendChild(cell); return }
      var up = c.p / lo[0] - 1;
      if(isNewLow(c.p, lo)){ cell.className = "c n"; cell.appendChild(el("b", null, "신저가")) }
      else {
        if(inZone(p[0], c.p, lo, age)) cell.className = "c z";
        cell.appendChild(el("b", "num", fmtPct(up, up >= 0.1 ? 0 : 1)));
      }
      g.appendChild(cell);
    });
    return g;
  }
  function card(c){
    var b = el("button", "card");
    b.onclick = function(){ location.hash = encodeURIComponent((S.ex === "upbit" ? "upbit-" : "") + c.s) };
    var top = el("div", "top"), l = el("div", "l"), nm = el("div", "nm", c.n);
    nm.appendChild(el("small", null, c.s));
    if(WS[c.m]) nm.appendChild(el("span", "star", "관심"));
    if(c.cau) nm.appendChild(el("span", "cau", "유의"));
    l.appendChild(nm);
    var t = TAGS[c.tag] || TAGS.NONE, s = el("div", "s");
    s.appendChild(el("span", "bdg " + t[1], t[0])); s.appendChild(el("em", null, c.tg));
    l.appendChild(s);
    var r = el("div", "r"), v = c.ch[S.sort];
    r.appendChild(el("i", null, sortLabel(S.sort)));
    r.appendChild(el("b", "num " + tone(v), v == null ? "-" : fmtPct(v)));
    var pr = el("span", "num", fmtPrice(c.p) + "원"); r.appendChild(pr);
    top.appendChild(l); top.appendChild(r); b.appendChild(top);
    if(S.view === "chips") b.appendChild(chips(c));
    return b;
  }

  function coinRow(m, btn){
    var c = null; cur().coins.forEach(function(x){ if(x.m === m) c = x });
    var r = el("div", "wr"), n = el("div", "wn");
    if(c){
      var b = el("b", null, c.n); n.appendChild(b); n.appendChild(el("small", null, c.s));
      if(c.cau) n.appendChild(el("span", "cau", "유의"));
      n.appendChild(el("div", "num", fmtPrice(c.p) + "원"));
    } else { n.appendChild(el("b", null, m)); n.appendChild(el("div", null, "이 거래소에서 찾을 수 없는 종목이에요")) }
    r.appendChild(n); r.appendChild(btn); return r;
  }
  function addResults(box){
    box.textContent = "";
    var q = (S.wq || "").toLowerCase(), have = WS, all = cur().coins.slice();
    var rows = all.filter(function(c){
      if(q) return c.n.toLowerCase().indexOf(q) >= 0 || c.s.toLowerCase().indexOf(q) >= 0;
      return !have[c.m];
    }).sort(function(a, b){ return b.v - a.v }).slice(0, 30);
    if(!rows.length){ box.appendChild(el("div", "empty", "찾는 코인이 없어요.")); return }
    rows.forEach(function(c){
      var btn;
      if(have[c.m]){ btn = el("span", "adb dn", "✓"); btn.setAttribute("aria-label", "이미 관심 종목이에요") }
      else { btn = el("button", "adb", "+"); btn.setAttribute("aria-label", c.n + " 관심에 추가"); btn.onclick = function(){ addWatch(c.m) } }
      box.appendChild(coinRow(c.m, btn));
    });
  }
  function renderPanel(){
    var box = $("wpanel"); box.textContent = "";
    var show = S.filter === "WATCH";
    box.hidden = !show;
    if(!show) return;
    var list = curWatch(S.ex), pn = el("div", "card wp");
    var top = el("div", "wtop"); top.appendChild(el("b", null, "관심 종목 " + list.length + "개"));
    top.appendChild(el("div", "wsub", "이 폰에만 저장돼요 · 텔레그램 유의 알림은 설정 파일(config.json)의 관심 목록 기준이에요")); pn.appendChild(top);
    var btns = el("div", "wbtns");
    function wb(text, cls, fn){ var b = el("button", "wb" + (cls ? " " + cls : ""), text); b.onclick = fn; btns.appendChild(b) }
    if(S.wmode === "view"){ wb("＋ 추가", "pri", function(){ S.wmode = "add"; S.wq = ""; renderList() }); wb("편집", "", function(){ S.wmode = "edit"; renderList() }) }
    else if(S.wmode === "edit"){ wb("완료", "pri", function(){ S.wmode = "view"; renderList() }); wb("＋ 추가", "", function(){ S.wmode = "add"; S.wq = ""; renderList() }) }
    else { wb("닫기", "pri", function(){ S.wmode = "view"; renderList() }) }
    pn.appendChild(btns);
    box.appendChild(pn);
    if(S.wmode === "edit"){
      var wl = el("div", "wlist");
      if(!list.length) wl.appendChild(el("div", "empty", "관심 종목이 없어요. 추가를 눌러 넣어 보세요."));
      list.forEach(function(m){
        var rm = el("button", "rmb", "−"); rm.setAttribute("aria-label", "관심에서 빼기"); rm.onclick = function(){ delWatch(m) };
        wl.appendChild(coinRow(m, rm));
      });
      box.appendChild(wl);
    } else if(S.wmode === "add"){
      var sw = el("div", "search wsearch"), inp2 = el("input"); inp2.type = "search"; inp2.placeholder = "추가할 코인 이름이나 기호로 검색"; inp2.value = S.wq || ""; inp2.autocomplete = "off"; inp2.setAttribute("aria-label", "추가할 코인 검색");
      sw.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>'; sw.appendChild(inp2); box.appendChild(sw);
      var res = el("div", "wlist"); box.appendChild(res);
      inp2.addEventListener("input", function(){ S.wq = this.value.trim(); addResults(res) });
      addResults(res);
    }
  }

  function renderList(){
    refreshWS();
    var n = counts(), box = $("chips"); box.textContent = "";
    var xb = $("ex"); xb.textContent = "";
    [["bithumb","빗썸"],["upbit","업비트"]].forEach(function(x){
      var b = el("button", null, x[1]); b.setAttribute("aria-pressed", S.ex === x[0] ? "true" : "false");
      b.onclick = function(){ switchEx(x[0]) };
      xb.appendChild(b);
    });
    $("lblTxt").textContent = S.dir === 1 ? "하락폭 순서 · 고른 기간에 많이 떨어진 코인부터" : "상승폭 순서 · 고른 기간에 많이 오른 코인부터";
    $("flip").setAttribute("aria-pressed", S.dir === -1 ? "true" : "false");
    filters().forEach(function(f){
      var b = el("button", "chip", f[1]); b.appendChild(el("b", "num", String(n[f[0]] || 0)));
      b.setAttribute("aria-pressed", S.filter === f[0] ? "true" : "false");
      b.onclick = function(){ S.filter = f[0]; S.shown = 30; if(f[0] !== "WATCH"){ S.wmode = "view" } renderList() };
      box.appendChild(b);
    });
    var sb = $("sort"); sb.textContent = "";
    SORTS.forEach(function(s){
      var b = el("button", null, s[1]); b.setAttribute("aria-pressed", S.sort === s[0] ? "true" : "false");
      b.onclick = function(){ S.sort = s[0]; S.shown = 30; renderList() };
      sb.appendChild(b);
    });
    var vb = $("view"); vb.textContent = "";
    VIEWS.forEach(function(v){
      var b = el("button", null, v[1]); b.setAttribute("aria-pressed", S.view === v[0] ? "true" : "false");
      b.onclick = function(){ S.view = v[0]; renderList() };
      vb.appendChild(b);
    });
    renderPanel();
    var editing = S.filter === "WATCH" && S.wmode !== "view";
    var all = sortedCoins(), list = $("list"); list.textContent = ""; list.hidden = editing;
    if(!all.length) list.appendChild(el("div", "empty", "해당하는 코인이 없어요."));
    all.slice(0, S.shown).forEach(function(c){ list.appendChild(card(c)) });
    $("legend").hidden = S.view !== "chips"; $("legendNote").hidden = S.view !== "chips";
    var more = $("more");
    if(editing){ more.hidden = true; $("legend").hidden = true; $("legendNote").hidden = true }
    else if(all.length > S.shown){
      more.hidden = false; more.textContent = "더 보기 (" + Math.min(30, all.length - S.shown) + "개 더, 남은 " + (all.length - S.shown) + "개)";
    } else more.hidden = true;

    var log = $("log"); log.textContent = "";
    if(!DATA.alerts || !DATA.alerts.length) log.appendChild(el("div", "empty", "아직 알림이 없어요."));
    else DATA.alerts.forEach(function(a){
      var li = el("div", "li"); li.appendChild(el("time", "num", kst(a.t))); li.appendChild(document.createTextNode(a.text)); log.appendChild(li);
    });
    (function(){
      var dg = (DATA.diag || {})[S.ex] || {}, t = "";
      if(dg.total){
        t = "데이터 상태 · " + EXN[S.ex] + ": 일봉을 2년(731일) 이상 받은 코인 " + (dg.long || 0) + "/" + dg.total + "개";
        if(dg.v1 || dg.legacy) t += " · 최근 갱신: 새 방식 " + (dg.v1 || 0) + "개" + (dg.legacy ? ", 옛 방식 " + dg.legacy + "개" : "") + (dg.avg ? " (평균 " + dg.avg + "일치)" : "");
        if(dg.err) t += " · 문제: " + dg.err;
      }
      $("diag").textContent = t; $("diag").hidden = !t;
    })();
    var exn = EXN[S.ex];
    $("foot").textContent = exn + " 원화마켓 " + cur().coins.length + "개 기준이에요. 하락폭과 변동률은 지금 가격을 각 기간 전 일봉 종가와 비교한 값이고, 1일은 " + (S.ex === "upbit" ? "전일 종가(오전 9시) 대비 변동" : "최근 24시간 변동") + "이에요. 저점 칩의 숫자는 그 기간 최저가보다 지금 가격이 몇 % 높은지예요. 1주~12개월은 최저가와 최고가 범위의 아래쪽 15% 안, 역대는 최저가보다 30% 이내일 때 저점 근처(보라색)로 봐요. 역대는 " + exn + "이 주는 일봉 전체 기준이고 상장 90일 미만은 판정하지 않아요." + (S.ex === "upbit" ? " 업비트 화면은 시세와 저점 판단만 보여 줘요. 관심 종목, 매수·매도 신호, 텔레그램 알림은 빗썸 기준이에요." : "") + " 참고용 정보이며 수익을 보장하지 않아요. 상승은 빨강, 하락은 파랑으로 표시해요.";
  }

      var bd = young ? ["판정 안 함", "mu"] : isNew ? ["새 최저가", "am"] : zone ? ["가장 싼 쪽", "vi"] : key === "a" ? ["저점에서 먼 편", "mu"] : pos >= 0.85 ? ["비싼 쪽", "mu"] : ["중간", "mu"];
      rt.appendChild(el("span", "bdg " + bd[1], bd[0])); row.appendChild(rt);
      var sent = el("div", "s"), hot = isNew ? "am-t" : zone ? "vi-t" : "";
      if(isNew){
        sent.appendChild(document.createTextNode("오늘 가장 싼 가격을 새로 썼어요"));
        if(c.pl && c.pl[key]) sent.appendChild(document.createTextNode(" (이전 " + fmtPrice(c.pl[key]) + "원)"));
      } else {
        sent.appendChild(document.createTextNode((key === "a" ? "상장 이후 " : "") + "가장 쌌던 가격 "));
        sent.appendChild(el("b", "num", fmtPrice(lo[0]) + "원")); sent.appendChild(document.createTextNode(" (" + daysText(lo[2]) + ") → 지금은 그보다 "));
        sent.appendChild(el("b", "num " + hot, fmtPct(c.p / lo[0] - 1).replace("+", "") + " 비싸요"));
        if(young) sent.appendChild(document.createTextNode(" · 상장 " + age + "일이라 90일이 지나면 판정해요"));
      }
      row.appendChild(sent);
      var bw = el("div", "bw"), bar = el("div", "bar");
      var zw = key === "a" ? Math.min(100, Math.max(2, (0.30 * lo[0] / Math.max(lo[1] - lo[0], 1e-12)) * 100)) : 15;
      var fill = el("s"); fill.style.width = zw + "%"; bar.appendChild(fill);
      var u = el("u");
      if(isNew){ u.className = "nl"; u.style.left = "0%"; u.style.marginLeft = "-4px" } else u.style.left = (pos * 100).toFixed(1) + "%";
      u.appendChild(el("i", null, "지금")); bar.appendChild(u); bw.appendChild(bar); row.appendChild(bw);
      var ends = el("div", "ends"); ends.appendChild(el("span", "num", "가장 쌈 " + fmtPrice(lo[0]) + "원")); ends.appendChild(el("span", "num", "가장 비쌈 " + fmtPrice(lo[1]) + "원"));
      row.appendChild(ends); card1.appendChild(row);
    });
    s1.appendChild(card1); v.appendChild(s1);

    // ③ 기간별 변동률 (그때 가격까지 보여 줘요)
    var s2 = section("기간별 변동률"), lead2 = el("p", "lead", "그때 가격과 비교해서 지금이 몇 % 높고 낮은지예요. 빨강은 올랐다는 뜻, 파랑은 내렸다는 뜻이에요.");
    s2.appendChild(lead2);
    var card2 = el("div", "card"), g = el("div", "grid7"), example = null, cellMap = {}, chartSec = null;
    if(!CP) CP = S.sort;
    function syncCells(){
      Object.keys(cellMap).forEach(function(k){
        cellMap[k].className = "cell" + (k === CP ? " sel" : "");
        cellMap[k].setAttribute("aria-pressed", k === CP ? "true" : "false");
      });
    }
    SORTS.forEach(function(sp){
      var chv = c.ch[sp[0]], cell = el("button", "cell" + (sp[0] === CP ? " sel" : ""));
      cell.setAttribute("aria-pressed", sp[0] === CP ? "true" : "false");
      cell.setAttribute("aria-label", sp[1] + " 전 변동률, 누르면 아래 차트가 그 기간으로 바뀌어요");
      cellMap[sp[0]] = cell;
      cell.onclick = function(){ CP = sp[0]; syncCells(); if(chartSec) chartSec.pick(sp[0]) };
      cell.appendChild(el("i", null, sp[1] + " 전"));
      cell.appendChild(el("b", "num " + tone(chv), chv == null ? "-" : fmtPct(chv)));
      var ref = chv == null ? null : c.p / (1 + chv);
      cell.appendChild(el("span", "num", ref == null ? "기록 없음" : fmtPrice(ref) + "원"));
      if(chv != null && (sp[0] === S.sort || !example)) example = [sp[1], ref, chv];
      g.appendChild(cell);
    });
    card2.appendChild(g);
    if(example) card2.appendChild(el("p", "note", "칸 아래 작은 숫자가 그때 가격이에요. 예: " + example[0] + " 전 " + fmtPrice(example[1]) + "원 → 지금 " + fmtPrice(c.p) + "원이라 " + fmtPct(Math.abs(example[2])).replace("+", "") + " " + (example[2] >= 0 ? "올랐어요." : "내렸어요.")));
    if(c.since){
      var cov = age >= 800 ? "최근 800일(약 2년 2개월)치 일봉을 받아서 계산해요 · 기록 시작 " + c.since
                           : "일봉 기록: " + c.since + "부터 " + age + "일치" + (age < 731 ? " · 24개월 비교에는 731일(약 2년) 이상이 필요해요" : "");
      card2.appendChild(el("p", "note", cov));
    }
    s2.appendChild(card2); v.appendChild(s2);
    chartSec = chartSection(c, syncCells);
    v.appendChild(chartSec);

    var s3 = section("관심과 알림"), card3 = el("div", "card"), inW = !!WS[c.m];
    if(w && w.status === "ok"){
      card3.appendChild(kv("점수", el("span", "num", (w.score > 0 ? "+" : "") + w.score)));
      if(w.rsi != null) card3.appendChild(kv("RSI", el("span", "num", w.rsi.toFixed(0))));
      card3.appendChild(kv("1시간 변동", el("span", "num " + tone(w.chg), fmtPct(w.chg))));
      if(w.reasons && w.reasons.length){ var ul = el("ul", "why"); w.reasons.forEach(function(r){ ul.appendChild(el("li", null, r)) }); card3.appendChild(ul) }
      if(w.target || w.stop) card3.appendChild(kv("목표가 · 손절가", el("span", "num", (w.target ? fmtPrice(w.target) : "-") + " · " + (w.stop ? fmtPrice(w.stop) : "-"))));
    }
    var inSrv = serverWatch(S.ex).indexOf(c.m) >= 0;
    var nt = inSrv ? "설정 파일의 관심 종목이라, 이 코인이 투자유의로 지정되거나 해제되면 텔레그램으로 알려 드려요."
           : inW ? "이 폰에서만 관심으로 표시돼요. 텔레그램 알림은 설정 파일(config.json)의 관심 목록 기준이에요."
           : "관심에 추가하면 이 폰에서 관심 탭으로 모아 볼 수 있어요.";
    if(inSrv && S.ex === "bithumb" && !(w && w.status === "ok")) nt += " RSI 같은 지표는 다음 자동 실행 뒤에 나타나요.";
    var p = el("p", "note", nt); p.style.marginTop = w && w.status === "ok" ? "8px" : "0"; card3.appendChild(p);
    var tg = el("button", "btn2", inW ? "관심에서 빼기" : "＋ 관심에 추가");
    tg.onclick = function(){ if(inW) delWatch(c.m); else addWatch(c.m) };
    card3.appendChild(tg);
    s3.appendChild(card3); v.appendChild(s3);

    var sh = section("숫자 보는 법", "이 코인 기준"), how = el("div", "card how");
    var exK = null; ["m", "q", "w", "h", "y"].some(function(k){ if(c.lo[k]){ exK = k; return true } return false });
    function hn(no, nodes){ var d = el("div", "n"); d.appendChild(el("em", null, String(no))); var t = el("div"); nodes.forEach(function(x){ t.appendChild(typeof x === "string" ? document.createTextNode(x) : x) }); d.appendChild(t); how.appendChild(d) }
    hn(1, [el("b", null, "가장 쌌던 가격"), ": 그 기간 중 하루 동안 가장 낮았던 가격이에요. 1주는 최근 7일, 1개월은 30일이에요."]);
    var n2 = [el("b", null, "○% 비싸요"), ": 지금 가격이 그 가격보다 얼마나 높은지예요."];
    if(exK){ var l0 = c.lo[exK][0]; n2.push(" 이 코인은 "); n2.push(el("code", null, fmtPrice(c.p) + " ÷ " + fmtPrice(l0) + " = " + (c.p / l0).toFixed(3))); n2.push("이라 " + fmtPct(c.p / l0 - 1).replace("+", "") + " 비싸요.") }
    hn(2, n2);
    hn(3, [el("b", null, "가장 싼 쪽"), ": 막대에서 점이 왼쪽 15% 안(보라색 칸)에 있다는 뜻이에요. 상장 이후 기준은 가장 쌌던 가격보다 30% 이내예요. 싸다는 표시일 뿐, 더 내려가지 않는다는 보장은 아니에요."]);
    sh.appendChild(how); v.appendChild(sh);

    var nl = el("a", "linkbtn"); nl.target = "_blank"; nl.rel = "noopener noreferrer";
    nl.href = "https://news.google.com/search?q=" + encodeURIComponent(c.n + " 코인") + "&hl=ko&gl=KR&ceid=KR%3Ako";
    nl.innerHTML = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
    nl.appendChild(document.createTextNode(c.n + " 뉴스 보기")); v.appendChild(nl);

    v.appendChild(el("p", "foot", "저점은 지나고 나서야 확인할 수 있어요. 저점권은 가격이 그 기간 중 싼 쪽에 있다는 뜻일 뿐, 더 내려가지 않는다는 보장이 아니에요. 참고용이에요."));
    window.scrollTo(0, keepScroll ? y : 0);
  }

  function route(){
    if(!DATA) return;
    var h = decodeURIComponent(location.hash.replace(/^#/, "")), c = null;
    if(h === "_news"){
      if(!$("listView").hidden) listY = window.scrollY;
      var sameN = curDetail === "_news"; curDetail = "_news"; showNews(sameN); return;
    }
    if(h.indexOf("upbit-") === 0){
      h = h.slice(6);
      if(S.ex !== "upbit"){ S.ex = "upbit"; S.shown = 30; if(S.filter !== "ALL" && !filters().some(function(f){ return f[0] === S.filter })) S.filter = "ALL" }
    }
    if(S.ex === "upbit" && !UP){ loadUp(); return }
    if(h) cur().coins.forEach(function(x){ if(x.s === h) c = x });
    if(c){
      if(!$("listView").hidden) listY = window.scrollY;
      var same = curDetail === c.s; curDetail = c.s; showDetail(c, same);
    } else {
      var was = curDetail !== null; curDetail = null;
      $("detailView").hidden = true; $("newsView").hidden = true; $("listView").hidden = false; renderList(); tick();
      if(was) window.scrollTo(0, listY);
    }
  }

  function load(){
    fetch("data.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json() })
      .then(function(d){
        if(!d.coins || !d.coins.length) throw new Error("empty");
        DATA = d; WATCH = {};
        (d.markets || []).forEach(function(m){ WATCH[m.market] = m });
        reconcile();
        if(UP || S.ex === "upbit") loadUp(true);
        route();
        if(curDetail === "_news") loadNews(false, function(){ showNews(true) });
      })
      .catch(function(){
        if(!DATA){
          $("sub").textContent = "데이터가 아직 없어요"; $("dot").className = "dot bad";
          var l = $("list"); l.textContent = ""; l.appendChild(el("div", "empty", "첫 자동 실행이 끝나면 여기에 나타나요. (설정 후 최대 5~15분)"));
        }
      });
  }

  function loadUp(quiet){
    if(upLoading) return;
    upLoading = true;
    fetch("upbit.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json() })
      .then(function(d){ if(!d.coins || !d.coins.length) throw new Error("empty"); UP = d; upLoading = false; route() })
      .catch(function(){
        upLoading = false;
        if(!quiet && S.ex === "upbit" && !UP){
          $("sub").textContent = "업비트 데이터를 준비 중이에요"; $("dot").className = "dot old";
          var l = $("list"); l.textContent = ""; l.appendChild(el("div", "empty", "업비트 데이터는 첫 자동 실행이 끝나면 나타나요. 처음에는 몇 번의 실행(5~30분)이 걸릴 수 있어요."));
          $("more").hidden = true;
        }
      });
  }
  function switchEx(x){
    if(S.ex === x) return;
    S.ex = x; S.shown = 30; S.wmode = "view"; S.wq = "";
    if(!filters().some(function(f){ return f[0] === S.filter })) S.filter = "ALL";
    if(x === "upbit" && !UP){
      $("ex").querySelectorAll("button").forEach(function(b, i){ b.setAttribute("aria-pressed", i === 1 ? "true" : "false") });
      var l = $("list"); l.textContent = ""; for(var i = 0; i < 4; i++) l.appendChild(el("div", "sk"));
      $("more").hidden = true; loadUp(); return;
    }
    location.hash = ""; renderList(); tick();
  }

  var THEMES = [["dark","어둡게"],["light","밝게"],["auto","자동"]];
  function curTheme(){ try { return localStorage.getItem("cs_theme") || "dark" } catch(e) { return "dark" } }
  function setTheme(t){
    var r = document.documentElement;
    if(t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
    try { localStorage.setItem("cs_theme", t) } catch(e) {}
    THEMES.forEach(function(x){ if(x[0] === t) $("theme").textContent = x[1] });
  }

  /* ---------- 방문 집계 (GoatCounter: 앱을 열 때 한 번, 개인정보 없이) ---------- */
  var STAT_SITE = "dipradar";
  function countVisit(){
    try{
      var h = location.hash;
      if(h === "#nostat" || h === "#stat"){   // 내 기기를 집계에서 빼거나(#nostat) 다시 넣기(#stat)
        if(h === "#nostat") lsSet("dr_nostat", "1"); else lsDel("dr_nostat");
        history.replaceState(null, "", location.pathname + location.search);
        toast(h === "#nostat" ? "이 기기는 방문 집계에서 제외했어요" : "이 기기도 방문 집계에 포함해요");
      }
      if(lsGet("dr_nostat") === "1") return;
      if(!/\.github\.io$/i.test(location.hostname)) return;   // 내 PC에서 파일을 열어 본 것은 세지 않아요
      var q = "https://" + STAT_SITE + ".goatcounter.com/count?p=" + encodeURIComponent("/") + "&t=" + encodeURIComponent(document.title)
            + "&r=" + encodeURIComponent(document.referrer || "") + "&s=" + encodeURIComponent(screen.width + "," + screen.height + ",1")
            + "&rnd=" + Math.random().toString(36).slice(2);
      new Image().src = q;
    }catch(e){}
  }

  (function init(){
    countVisit();
    setTheme(curTheme());
    $("theme").onclick = function(){
      var i = 0; THEMES.forEach(function(x, k){ if(x[0] === curTheme()) i = k });
      setTheme(THEMES[(i + 1) % THEMES.length][0]);
    };
    var l = $("list"); for(var i = 0; i < 4; i++) l.appendChild(el("div", "sk"));
    $("q").addEventListener("input", function(){ S.q = this.value.trim(); S.shown = 30; if(DATA) renderList() });
    $("more").onclick = function(){ S.shown += 30; renderList() };
    $("flip").onclick = function(){ S.dir = -S.dir; S.shown = 30; if(cur()) renderList() };
    $("rf").onclick = function(){ load(); if(curDetail === "_news") loadNews(true, function(){ showNews(true) }) };
    $("newsBtn").onclick = function(){ location.hash = "_news" };
    window.addEventListener("hashchange", route);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) load() });
    setInterval(load, 120000); setInterval(tick, 30000);
    load();
  })();
})();
</script>
</body>
</html>
