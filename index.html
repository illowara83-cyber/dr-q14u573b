<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<script>
(function(){
  var t = "dark";
  try { t = localStorage.getItem("cs_theme") || "dark" } catch(e) {}
  if (t !== "auto") document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
})();
</script>
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Coin Time</title>
<style>
:root{
  --bg:#ffffff; --fg:#09090b; --card:#ffffff; --muted:#f4f4f5; --mfg:#71717a; --bd:#e4e4e7; --ring:#a1a1aa;
  --radius:10px;
  --up:#dc2626; --down:#2563eb;
  --vi:#6d28d9; --vi-bg:#f5f3ff; --vi-bd:#ddd6fe; --vi-bar:#a78bfa;
  --am:#b45309; --am-bg:#fffbeb; --am-bd:#fde68a;
  --gr:#15803d; --gr-bg:#f0fdf4; --gr-bd:#bbf7d0;
  --warn-bg:#fffbeb; --warn-fg:#92400e;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09090b; --fg:#fafafa; --card:#0f0f12; --muted:#27272a; --mfg:#a1a1aa; --bd:#27272a; --ring:#52525b;
    --up:#f87171; --down:#60a5fa;
    --vi:#c4b5fd; --vi-bg:#1b1535; --vi-bd:#4c1d95; --vi-bar:#5b21b6;
    --am:#fbbf24; --am-bg:#26190a; --am-bd:#78350f;
    --gr:#4ade80; --gr-bg:#0a2014; --gr-bd:#14532d;
    --warn-bg:#26190a; --warn-fg:#fcd34d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09090b; --fg:#fafafa; --card:#0f0f12; --muted:#27272a; --mfg:#a1a1aa; --bd:#27272a; --ring:#52525b;
  --up:#f87171; --down:#60a5fa;
  --vi:#c4b5fd; --vi-bg:#1b1535; --vi-bd:#4c1d95; --vi-bar:#5b21b6;
  --am:#fbbf24; --am-bg:#26190a; --am-bd:#78350f;
  --gr:#4ade80; --gr-bg:#0a2014; --gr-bd:#14532d;
  --warn-bg:#26190a; --warn-fg:#fcd34d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--ring); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:16px 14px 48px}
.num{font-variant-numeric:tabular-nums}
.mu{color:var(--mfg)}
.up{color:var(--up)} .down{color:var(--down)}
[hidden]{display:none !important}

.hdr{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
.hdr h1{margin:0; font-size:19px; font-weight:600; letter-spacing:-0.01em}
.sub{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--mfg); margin-top:2px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--mfg); display:inline-block}
.dot.ok{background:var(--gr)} .dot.old{background:var(--am)} .dot.bad{background:var(--up)}
.ibtn{width:44px; height:44px; border:1px solid var(--bd); border-radius:var(--radius); display:inline-flex; align-items:center; justify-content:center; color:var(--mfg); background:var(--card)}
.ibtn:hover{background:var(--muted)}
.ibtn.tx{width:auto; min-width:64px; padding:0 14px; font-size:13.5px; color:var(--fg)}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
.alert{border:1px solid var(--am-bd); background:var(--warn-bg); color:var(--warn-fg); border-radius:var(--radius); padding:10px 12px; font-size:13px; margin-bottom:12px}

.search{position:relative; margin-bottom:14px}
.search svg{position:absolute; left:12px; top:13px; color:var(--mfg)}
.search input{width:100%; height:44px; border:1px solid var(--bd); border-radius:var(--radius); background:var(--card); padding:0 12px 0 38px}
.search input::placeholder{color:var(--mfg)}
.lbl{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; color:var(--mfg); margin:0 2px 6px}
.flip{display:inline-flex; align-items:center; gap:6px; flex:none; height:34px; padding:0 11px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--fg); font-size:13px}
.flip:hover{background:var(--muted)}
.flip[aria-pressed="true"]{border-color:var(--fg)}
.flip svg.i{width:15px; height:15px}
.seg{display:flex; gap:3px; padding:3px; background:var(--muted); border-radius:var(--radius); overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto; min-width:48px; height:42px; padding:0 10px; border-radius:7px; font-size:13.5px; color:var(--mfg); white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg); color:var(--bg); font-weight:600}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; margin:12px 0 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; height:38px; padding:0 13px; border:1px solid var(--bd); border-radius:999px; font-size:13.5px; color:var(--mfg); background:var(--card); white-space:nowrap}
.chip b{font-weight:600; color:var(--fg); margin-left:5px}
.chip[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.chip[aria-pressed="true"] b{color:var(--bg)}

.list{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.card{display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:14px}
button.card:hover{background:var(--muted)}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px}
.l{display:flex; flex-direction:column; gap:7px; min-width:0}
.nm{font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nm small{font-size:12px; font-weight:400; color:var(--mfg); margin-left:6px}
.s{display:flex; align-items:center; gap:8px; min-width:0}
.s em{font-style:normal; font-size:13px; color:var(--mfg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.r{text-align:right; flex:none}
.r i{display:block; font-style:normal; font-size:11.5px; color:var(--mfg)}
.r b{display:block; font-size:22px; font-weight:600; line-height:1.15; letter-spacing:-0.01em}
.r span{font-size:13px; color:var(--mfg)}
.bdg{display:inline-flex; align-items:center; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:600; border:1px solid transparent; white-space:nowrap; flex:none}
.bdg.vi{background:var(--vi-bg); color:var(--vi); border-color:var(--vi-bd)}
.bdg.vo{background:transparent; color:var(--vi); border-color:var(--vi-bd)}
.bdg.am{background:var(--am-bg); color:var(--am); border-color:var(--am-bd)}
.bdg.gr{background:var(--gr-bg); color:var(--gr); border-color:var(--gr-bd)}
.bdg.mu{background:var(--muted); color:var(--mfg)}
.star{font-size:11px; font-weight:500; color:var(--fg); border:1px solid var(--bd); border-radius:4px; padding:0 5px; margin-left:6px; vertical-align:2px}

.g3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; margin-top:12px}
.c{border:1px solid var(--bd); border-radius:10px; padding:8px 10px; display:flex; flex-direction:column; gap:2px; background:var(--bg); min-width:0}
.c i{font-style:normal; font-size:12px; color:var(--mfg)}
.c b{font-size:16px; font-weight:600; white-space:nowrap}
.c.z{background:var(--vi-bg); border-color:var(--vi-bd)}
.c.z i,.c.z b{color:var(--vi)}
.c.n{background:var(--am-bg); border-color:var(--am-bd)}
.c.n i,.c.n b{color:var(--am)}
.c.sel{border-color:var(--fg)}
.c b.s2{font-size:13px; font-weight:500; color:var(--mfg)}
.lg{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mfg); padding:2px 2px 0; margin-top:4px}
.lg span::before{content:""; display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:6px; vertical-align:-1px; border:1px solid var(--bd)}
.lg .a::before{background:var(--vi-bg); border-color:var(--vi-bd)}
.lg .b::before{background:var(--am-bg); border-color:var(--am-bd)}
.more{width:100%; height:46px; margin-top:12px; border:1px solid var(--bd); border-radius:var(--radius); background:var(--card); font-weight:500}
.more:hover{background:var(--muted)}
.empty{padding:28px 8px; text-align:center; color:var(--mfg)}
.sk{height:84px; border-radius:14px; background:linear-gradient(90deg,var(--muted),var(--bd),var(--muted)); background-size:200% 100%; animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}

h2{font-size:15px; font-weight:600; margin:26px 2px 8px}
.log{padding:2px 14px}
.li{padding:12px 0; border-bottom:1px solid var(--bd); font-size:13.5px; white-space:pre-line}
.li:last-child{border-bottom:0}
.li time{display:block; font-size:12px; color:var(--mfg); margin-bottom:2px}
.foot{margin:16px 2px 0; color:var(--mfg); font-size:12.5px; line-height:1.7}

.back{display:inline-flex; align-items:center; gap:6px; height:44px; padding:0 10px 0 4px; margin-left:-4px; color:var(--mfg); font-size:14.5px}
.back:hover{color:var(--fg)}
.dh{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:2px 0 14px}
.dh h1{margin:0; font-size:23px; font-weight:600; letter-spacing:-0.01em}
.dh h1 small{font-size:13px; font-weight:400; color:var(--mfg); margin-left:6px}
.dh .big{font-size:25px; font-weight:600; text-align:right}
.dh .big small{font-size:13px; font-weight:400; color:var(--mfg)}
.verdict{border:1px solid var(--bd); border-radius:14px; padding:14px; margin-bottom:16px}
.verdict.vi{background:var(--vi-bg); border-color:var(--vi-bd)}
.verdict.am{background:var(--am-bg); border-color:var(--am-bd)}
.verdict.gr{background:var(--gr-bg); border-color:var(--gr-bd)}
.verdict h3{margin:0 0 6px; font-size:17px; font-weight:600}
.verdict.vi h3{color:var(--vi)} .verdict.am h3{color:var(--am)} .verdict.gr h3{color:var(--gr)}
.verdict p{margin:0 0 4px; font-size:14px; line-height:1.6}
.sec{margin-bottom:16px}
.sec>.hd{display:flex; justify-content:space-between; align-items:baseline; margin:0 2px 8px}
.sec>.hd b{font-size:15px; font-weight:600}
.sec>.hd span{font-size:12px; color:var(--mfg)}
.rows{padding:2px 14px; overflow:hidden}
.row{padding:14px 0; border-bottom:1px solid var(--bd); display:flex; flex-direction:column; gap:9px}
.row:last-child{border-bottom:0}
.row.hl{background:var(--vi-bg); margin:0 -14px; padding:14px}
.rt{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.rt b{font-weight:600; font-size:15px}
.rt span{font-size:13px; color:var(--mfg)}
.bar{position:relative; height:12px; border-radius:6px; background:var(--muted)}
.bar s{position:absolute; left:0; top:0; bottom:0; border-radius:6px 0 0 6px; background:var(--vi-bar)}
.bar u{position:absolute; top:-4px; width:20px; height:20px; margin-left:-10px; border-radius:50%; background:var(--fg); border:3px solid var(--card); box-sizing:border-box}
.row.hl .bar u{border-color:var(--vi-bg)}
.bar u.nl{background:var(--am)}
.rb{display:flex; justify-content:space-between; gap:8px; font-size:13px}
.rb .lo{font-weight:600}
.vi-t{color:var(--vi)} .am-t{color:var(--am)}
.chead{display:flex; justify-content:space-between; align-items:baseline; margin:14px 2px 6px; font-size:13px}
.chead b{font-size:22px; font-weight:600; letter-spacing:-0.01em}
.chart{display:block; width:100%; height:auto; touch-action:pan-y; cursor:crosshair; color:var(--fg)}
.cinfo{display:flex; flex-direction:column; gap:3px; margin:8px 2px 2px; font-size:12.5px; color:var(--mfg)}
.cinfo .r2{display:flex; justify-content:space-between; gap:8px}
.cinfo .v1{color:var(--fg); font-weight:500}
.cbox .sk{height:170px}
.cbox .empty{padding:44px 8px}
.grid7{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px}
.cell{border:1px solid var(--bd); border-radius:10px; padding:8px 2px 7px; text-align:center; min-width:0; background:var(--bg)}
.cell.sel{border-color:var(--fg)}
.cell i{display:block; font-style:normal; font-size:12px; color:var(--mfg); line-height:1.2}
.cell b{display:block; font-size:14px; font-weight:600; margin-top:2px; white-space:nowrap}
.kv{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:7px 0; font-size:14px}
.kv span:first-child{color:var(--mfg)}
.why{margin:6px 0 0; padding-left:18px; font-size:13.5px}
.note{margin:8px 0 0; font-size:13px; color:var(--mfg); line-height:1.7}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--muted); padding:1px 5px; border-radius:4px}
</style>
</head>
<body>
<div class="wrap">

  <div id="listView">
    <div class="hdr">
      <div>
        <h1>Coin Time</h1>
        <div class="sub"><span class="dot" id="dot"></span><span id="sub">불러오는 중</span></div>
      </div>
      <div style="display:flex;gap:8px">
      <button class="ibtn tx" id="theme" aria-label="화면 색 바꾸기">어둡게</button>
      <button class="ibtn" id="rf" aria-label="새로고침"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
      </div>
    </div>
    <div id="stale" class="alert" hidden></div>

    <div class="seg" id="ex" role="group" aria-label="거래소" style="margin-bottom:12px"></div>

    <div class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="코인 이름이나 기호로 검색" autocomplete="off" aria-label="코인 검색"></div>

    <div class="lbl"><span id="lblTxt">하락폭 순서 · 고른 기간에 많이 떨어진 코인부터</span><button class="flip" id="flip" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg>순서 뒤집기</button></div>
    <div class="seg" id="sort" role="group" aria-label="하락폭 기준 기간"></div>

    <div class="chips" id="chips" role="group" aria-label="필터"></div>

    <div class="seg" id="view" role="group" aria-label="보기 방식"></div>

    <div class="list" id="list"></div>
    <div class="lg" id="legend" hidden><span class="a">저점 근처</span><span class="b">새 최저가</span><span>그 밖</span></div>
    <button class="more" id="more" hidden></button>

    <h2>최근 알림</h2>
    <div class="card log" id="log"><div class="empty">아직 알림이 없어요.</div></div>
    <p class="foot" id="foot"></p>
  </div>

  <div id="detailView" hidden></div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(i){ return document.getElementById(i) };
  var DATA = null, UP = null, WATCH = {}, curDetail = null, listY = 0, upLoading = false;
  var S = {sort:"m", filter:"ALL", view:"simple", q:"", shown:30, ex:"bithumb", dir:1};
  var EXN = {bithumb:"빗썸", upbit:"업비트"};
  function cur(){ return S.ex === "upbit" ? UP : DATA }
  var SORTS = [["d","1일"],["w","1주"],["m","1개월"],["q","3개월"],["h","6개월"],["y","12개월"],["y2","24개월"]];
  var PERIODS = [["w","1주"],["m","1개월"],["q","3개월"],["h","6개월"],["y","12개월"],["a","역대"]];
  var TAGS = {NEWLOW:["신저가 갱신","am"], REBOUND:["저점 반등","gr"], LOW:["저점권","vi"], SHORT:["단기 저점","vo"], HIGH:["고점권","mu"], MID:["중간","mu"], NONE:["준비 중","mu"]};
  var FILTERS = [["ALL","전체"],["WATCH","관심"],["BUY","매수 후보"],["SELL","매도 후보"],["LOW","저점권"],["NEWLOW","신저가"],["REBOUND","저점 반등"]];
  var VIEWS = [["simple","간단히"],["chips","저점 칩"],["chg","변동률"]];
  var VERDICT = {
    NEWLOW:["신저가 갱신","am","더 내려갈 수 있는 상태예요. 반등이 확인될 때까지 지켜보세요."],
    REBOUND:["저점 반등","gr","저점에서 4% 이상 올라서고 3일 전보다 높을 때 표시돼요."],
    LOW:["저점권 · 반등 대기","vi","아직 반등이 확인되지 않았어요."],
    SHORT:["단기 저점","vi","1주나 1개월 범위의 아래쪽 15% 안이에요. 3개월 이상 기간으로는 아직 저점권이 아니에요."],
    HIGH:["고점권","","3개월 범위의 위쪽 15% 안에 있어요."],
    MID:["중간","","저점과 고점 사이에 있어요."],
    NONE:["데이터 준비 중","","일봉을 받는 중이에요. 다음 자동 실행 뒤에 보여요."]
  };

  function el(tag, cls, text){ var d = document.createElement(tag); if(cls) d.className = cls; if(text != null) d.textContent = text; return d }
  function fmtPrice(p){
    var d = p >= 1000 ? 0 : p >= 100 ? 1 : p >= 10 ? 2 : p >= 1 ? 3 : p >= 0.1 ? 4 : 6;
    return p.toLocaleString("ko-KR", {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  function fmtPct(x, d){
    var dd = d == null ? 1 : d, v = x * 100;
    var t = Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:dd, maximumFractionDigits:dd});
    return (v > 0.0001 ? "+" : v < -0.0001 ? "-" : "") + t + "%";
  }
  function posOf(p, lo){ return lo[1] <= lo[0] ? 0.5 : Math.min(1, Math.max(0, (p - lo[0]) / (lo[1] - lo[0]))) }
  function sortLabel(k){ for(var i = 0; i < SORTS.length; i++) if(SORTS[i][0] === k) return SORTS[i][1]; return k }
  function isNewLow(p, lo){ return !!lo && lo[2] === 0 && p <= lo[0] * 1.0005 }
  function inZone(key, p, lo, age){
    if(!lo) return false;
    if(key === "a") return age >= 90 && p / lo[0] - 1 <= 0.30;
    return posOf(p, lo) <= 0.15;
  }
  function ago(iso){
    var m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if(m < 1) return "방금"; if(m < 60) return m + "분 전";
    var h = Math.floor(m / 60); return h < 24 ? h + "시간 전" : Math.floor(h / 24) + "일 전";
  }
  function kst(iso){
    var d = new Date(new Date(iso).getTime() + 9 * 3600 * 1000), p = function(n){ return (n < 10 ? "0" : "") + n };
    return (d.getUTCMonth() + 1) + "/" + d.getUTCDate() + " " + p(d.getUTCHours()) + ":" + p(d.getUTCMinutes());
  }
  function daysText(n){
    if(n === 0) return "오늘";

      var p;
      if(S.ex === "upbit"){
        p = el("p", "note", "업비트 화면은 시세와 저점 판단만 보여 줘요. 매수·매도 신호와 텔레그램 알림은 빗썸 관심 종목 기준이에요.");
      } else {
        p = el("p", "note", "관심 종목이 아니라 텔레그램 알림은 오지 않아요. 알림을 받으려면 저장소의 ");
        p.appendChild(el("code", null, "config.json")); p.appendChild(document.createTextNode("에서 markets에 "));
        p.appendChild(el("code", null, '"' + c.m + '"')); p.appendChild(document.createTextNode("을 추가해 주세요."));
      }
      p.style.marginTop = "0"; card3.appendChild(p);
    }
    s3.appendChild(card3); v.appendChild(s3);

    v.appendChild(el("p", "foot", "저점은 지나고 나서야 확인할 수 있어요. 저점권은 가격이 그 기간 중 싼 쪽에 있다는 뜻일 뿐, 더 내려가지 않는다는 보장이 아니에요. 참고용이에요."));
    window.scrollTo(0, keepScroll ? y : 0);
  }

  function route(){
    if(!DATA) return;
    var h = decodeURIComponent(location.hash.replace(/^#/, "")), c = null;
    if(h.indexOf("upbit-") === 0){
      h = h.slice(6);
      if(S.ex !== "upbit"){ S.ex = "upbit"; S.shown = 30; if(S.filter !== "ALL" && !filters().some(function(f){ return f[0] === S.filter })) S.filter = "ALL" }
    }
    if(S.ex === "upbit" && !UP){ loadUp(); return }
    if(h) cur().coins.forEach(function(x){ if(x.s === h) c = x });
    if(c){
      if(!$("listView").hidden) listY = window.scrollY;
      var same = curDetail === c.s; curDetail = c.s; showDetail(c, same);
    } else {
      var was = curDetail !== null; curDetail = null;
      $("detailView").hidden = true; $("listView").hidden = false; renderList(); tick();
      if(was) window.scrollTo(0, listY);
    }
  }

  function load(){
    fetch("data.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json() })
      .then(function(d){
        if(!d.coins || !d.coins.length) throw new Error("empty");
        DATA = d; WATCH = {};
        (d.markets || []).forEach(function(m){ WATCH[m.market] = m });
        if(UP || S.ex === "upbit") loadUp(true);
        route();
      })
      .catch(function(){
        if(!DATA){
          $("sub").textContent = "데이터가 아직 없어요"; $("dot").className = "dot bad";
          var l = $("list"); l.textContent = ""; l.appendChild(el("div", "empty", "첫 자동 실행이 끝나면 여기에 나타나요. (설정 후 최대 10~15분)"));
        }
      });
  }

  function loadUp(quiet){
    if(upLoading) return;
    upLoading = true;
    fetch("upbit.json?t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json() })
      .then(function(d){ if(!d.coins || !d.coins.length) throw new Error("empty"); UP = d; upLoading = false; route() })
      .catch(function(){
        upLoading = false;
        if(!quiet && S.ex === "upbit" && !UP){
          $("sub").textContent = "업비트 데이터를 준비 중이에요"; $("dot").className = "dot old";
          var l = $("list"); l.textContent = ""; l.appendChild(el("div", "empty", "업비트 데이터는 첫 자동 실행이 끝나면 나타나요. 처음에는 몇 번의 실행(10~30분)이 걸릴 수 있어요."));
          $("more").hidden = true;
        }
      });
  }
  function switchEx(x){
    if(S.ex === x) return;
    S.ex = x; S.shown = 30;
    if(!filters().some(function(f){ return f[0] === S.filter })) S.filter = "ALL";
    if(x === "upbit" && !UP){
      $("ex").querySelectorAll("button").forEach(function(b, i){ b.setAttribute("aria-pressed", i === 1 ? "true" : "false") });
      var l = $("list"); l.textContent = ""; for(var i = 0; i < 4; i++) l.appendChild(el("div", "sk"));
      $("more").hidden = true; loadUp(); return;
    }
    location.hash = ""; renderList(); tick();
  }

  var THEMES = [["dark","어둡게"],["light","밝게"],["auto","자동"]];
  function curTheme(){ try { return localStorage.getItem("cs_theme") || "dark" } catch(e) { return "dark" } }
  function setTheme(t){
    var r = document.documentElement;
    if(t === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t);
    try { localStorage.setItem("cs_theme", t) } catch(e) {}
    THEMES.forEach(function(x){ if(x[0] === t) $("theme").textContent = x[1] });
  }

  (function init(){
    setTheme(curTheme());
    $("theme").onclick = function(){
      var i = 0; THEMES.forEach(function(x, k){ if(x[0] === curTheme()) i = k });
      setTheme(THEMES[(i + 1) % THEMES.length][0]);
    };
    var l = $("list"); for(var i = 0; i < 4; i++) l.appendChild(el("div", "sk"));
    $("q").addEventListener("input", function(){ S.q = this.value.trim(); S.shown = 30; if(DATA) renderList() });
    $("more").onclick = function(){ S.shown += 30; renderList() };
    $("flip").onclick = function(){ S.dir = -S.dir; S.shown = 30; if(cur()) renderList() };
    $("rf").onclick = load;
    window.addEventListener("hashchange", route);
    document.addEventListener("visibilitychange", function(){ if(!document.hidden) load() });
    setInterval(load, 120000); setInterval(tick, 30000);
    load();
  })();
})();
</script>
</body>
</html>
